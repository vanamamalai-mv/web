
<!DOCTYPE html>
<html ng-app="taskApp">
<head>
    <title>Task Management</title>

    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f6f9;
        }

        input, textarea, select {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 3px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #dbeafe;
        }

        .message {
            color: green;
        }
    </style>
</head>

<body ng-controller="TaskController">

    <h2>Task Management System</h2>

    <form ng-submit="saveTask()">

        <input type="text"
               ng-model="task.title"
               placeholder="Task Title"
               required>

        <input type="text"
               ng-model="task.description"
               placeholder="Description"
               required>

        <input type="date"
               ng-model="task.dueDate"
               required>

        <select ng-model="task.status" required>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>

        <button type="submit">
            {{ editId ? 'Update Task' : 'Add Task' }}
        </button>

        <button type="button"
                ng-click="cancelEdit()"
                ng-if="editId">
            Cancel
        </button>

    </form>

    <p class="message">{{ message }}</p>

    <h3>Task List</h3>

    <table>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>

        <tr ng-repeat="t in tasks">
            <td>{{ t.title }}</td>
            <td>{{ t.description }}</td>
            <td>{{ t.dueDate | date:'yyyy-MM-dd' }}</td>
            <td>{{ t.status }}</td>
            <td>
                <button ng-click="editTask(t)">Edit</button>
                <button ng-click="deleteTask(t._id)">Delete</button>
            </td>
        </tr>

        <tr ng-if="tasks.length === 0">
            <td colspan="5">No tasks found</td>
        </tr>
    </table>

    <script>
        var app = angular.module("taskApp", []);

        app.controller("TaskController", function($scope, $http) {

            var api = "http://localhost:3001/tasks";

            $scope.tasks = [];
            $scope.task = { status: "Pending" };
            $scope.editId = null;
            $scope.message = "";

            // READ
            $scope.loadTasks = function() {
                $http.get(api).then(function(response) {
                    $scope.tasks = response.data;
                }, function() {
                    $scope.message = "Unable to load tasks";
                });
            };

            // CREATE or UPDATE
            $scope.saveTask = function() {

                var data = angular.copy($scope.task);

                // Convert date to yyyy-MM-dd for MongoDB
                if (data.dueDate instanceof Date) {
                    var d = data.dueDate;
                    data.dueDate =
                        d.getFullYear() + "-" +
                        String(d.getMonth() + 1).padStart(2, "0") + "-" +
                        String(d.getDate()).padStart(2, "0");
                }

                if ($scope.editId) {
                    $http.put(api + "/" + $scope.editId, data)
                        .then(function() {
                            $scope.message = "Task updated successfully";
                            $scope.cancelEdit();
                            $scope.loadTasks();
                        }, function() {
                            $scope.message = "Failed to update task";
                        });
                } else {
                    $http.post(api, data)
                        .then(function() {
                            $scope.message = "Task added successfully";
                            $scope.task = { status: "Pending" };
                            $scope.loadTasks();
                        }, function() {
                            $scope.message = "Failed to add task";
                        });
                }
            };

            // EDIT
            $scope.editTask = function(t) {
                $scope.task = {
                    title: t.title,
                    description: t.description,
                    dueDate: new Date(t.dueDate + "T00:00:00"),
                    status: t.status
                };

                $scope.editId = t._id;
            };

            // CANCEL
            $scope.cancelEdit = function() {
                $scope.task = { status: "Pending" };
                $scope.editId = null;
            };

            // DELETE
            $scope.deleteTask = function(id) {
                if (confirm("Do you want to delete this task?")) {
                    $http.delete(api + "/" + id)
                        .then(function() {
                            $scope.message = "Task deleted successfully";

                            if ($scope.editId === id) {
                                $scope.cancelEdit();
                            }

                            $scope.loadTasks();
                        }, function() {
                            $scope.message = "Failed to delete task";
                        });
                }
            };

            // Load tasks on page opening
            $scope.loadTasks();
        });
    </script>

</body>
</html>
